<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      background: #edf3f6;
      color: #142c39;
      font: 16px/1.5 system-ui, sans-serif;
    }
    main {
      max-width: 560px;
      margin: 5vh auto;
      padding: clamp(18px, 5vw, 36px);
      border-radius: 16px;
      background: white;
      box-shadow: 0 5px 24px #142c3914;
    }
    h1 {
      margin: 0 0 20px;
      font-size: clamp(24px, 6vw, 34px);
      line-height: 1.15;
    }
    label { display: block; margin-top: 16px; font-weight: 650; }
    small { display: block; color: #475f6c; }
    input {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #a9bac3;
      border-radius: 8px;
      font: inherit;
    }
    button, .download {
      display: inline-block;
      margin-top: 20px;
      padding: 11px 16px;
      background: #075d57;
      color: white;
      border: 0;
      border-radius: 8px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled { opacity: .65; cursor: wait; }
    [hidden] { display: none !important; }
    #status { white-space: pre-line; margin: 12px 0 0; }
    #status[data-error] { color: #9b2525; }
  </style>
</head>
<body>
  <main>
    <h1>AWB + Packing List Combiner</h1>
    <form id="combiner">
      <label for="awb">Airway bill PDF</label>
      <input id="awb" type="file" accept=".pdf,application/pdf" required>

      <label for="packing">Packing list PDF</label>
      <input id="packing" type="file" accept=".pdf,application/pdf" required>

      <button type="submit">Combine PDFs</button>
      <a id="download" class="download" target="_blank" rel="noopener" hidden>Download PDF</a>
      <p id="status" role="status" aria-live="polite"></p>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"
          integrity="sha384-weMABwrltA6jWR8DDe9Jp5blk+tZQh7ugpCsF3JwSA53WZM9/14PjS5LAJNHNjAI"
          crossorigin="anonymous">
  </script>
  <script>
    const points = mm => mm * 72 / 25.4;

    const quadrants = [
      { column: 0, row: 0, label: 'top-left' },
      { column: 0, row: 1, label: 'bottom-left' },
      { column: 1, row: 0, label: 'top-right' },
      { column: 1, row: 1, label: 'bottom-right' }
    ];

    const pdfJsBase = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/legacy/build/';
    let pdfJsPromise;

    function loadTextReader() {
      if (!pdfJsPromise) {
        pdfJsPromise = import(pdfJsBase + 'pdf.mjs').then(pdfjs => {
          pdfjs.GlobalWorkerOptions.workerSrc = pdfJsBase + 'pdf.worker.mjs';
          return pdfjs;
        }).catch(() => {
          pdfJsPromise = undefined;
          throw new Error('The PDF text reader could not load. Reload the page and try again.');
        });
      }
      return pdfJsPromise;
    }

    function geometry(page) {
      const media = page.getMediaBox();
      const crop = page.getCropBox();
      const left = Math.max(media.x, crop.x);
      const bottom = Math.max(media.y, crop.y);
      const right = Math.min(media.x + media.width, crop.x + crop.width);
      const top = Math.min(media.y + media.height, crop.y + crop.height);
      const box = right > left && top > bottom
                  ? { left, bottom, right, top }
                  : {
                      left: media.x,
                      bottom: media.y,
                      right: media.x + media.width,
                      top: media.y + media.height
                    };
      const rotation = ((page.getRotation().angle % 360) + 360) % 360;
      const boxWidth = box.right - box.left;
      const boxHeight = box.top - box.bottom;
      const sideways = rotation === 90 || rotation === 270;
      return {
        box, rotation,
        width: sideways ? boxHeight : boxWidth,
        height: sideways ? boxWidth : boxHeight
      };
    }

    function validate(doc, label, expectedWidth, expectedHeight) {
      const pages = doc.getPages();
      if (!pages.length) throw new Error(label + ' is empty.');

      return pages.map((page, index) => {
        const view = geometry(page);
        if (Math.abs(view.width - points(expectedWidth)) > 3 ||
            Math.abs(view.height - points(expectedHeight)) > 3) {
          const mm = value => (value * 25.4 / 72).toFixed(1);
          throw new Error(
            label + ', page ' + (index + 1) + ', has the wrong size.\n' +
            'Detected ' + mm(view.width) + ' × ' + mm(view.height) + ' mm.\n' +
            'Expected ' + expectedWidth + ' × ' + expectedHeight + ' mm portrait.'
          );
        }
        return view;
      });
    }

    async function readPdf(file, label) {
      try {
        return await PDFLib.PDFDocument.load(await file.arrayBuffer());
      }
      catch (error) {
        throw new Error(
          'Could not open the ' + label + ' PDF. Select a valid, unlocked PDF.'
        );
      }
    }

    function orderIds(items) {
      const lines = [];

      for (const item of items.sort((a, b) => a.y - b.y || a.x - b.x)) {
        let line = lines.at(-1);
        if (!line || Math.abs(line.y - item.y) > 2) {
          line = { y: item.y, items: [] };
          lines.push(line);
        }
        line.items.push(item);
      }

      const textLines = lines.map(line => {
        let previous;
        let text = '';

        for (const item of line.items.sort((a, b) => a.x - b.x)) {
          if (previous && item.x - previous.endX > Math.max(0.6, item.height * 0.08)) {
            text += ' ';
          }
          text += item.text;
          previous = item;
        }

        return { y: line.y, text: text.trim() };
      });

      const ids = new Set();
      const token = '[A-Z0-9]+(?:[-_/][A-Z0-9]+)*';
      const sameLine = new RegExp('^\\s*[:#=]?\\s*(' + token + ')(?=$|[\\s,;.)])', 'i');
      const ownLine = new RegExp('^\\s*(' + token + ')\\s*$', 'i');

      for (const [index, line] of textLines.entries()) {
        const labels = [...line.text.matchAll(/\border\s*id\b/gi)];

        for (const [labelIndex, label] of labels.entries()) {
          const afterLabel = line.text.slice(
            label.index + label[0].length,
            labels[labelIndex + 1]?.index
          );

          let match = afterLabel.match(sameLine);
          const next = textLines[index + 1];

          if (!match && /^\s*[:#=]?\s*$/.test(afterLabel) &&
              next && next.y - line.y <= 24) {
            match = next.text.match(ownLine);
          }

          if (match) ids.add(match[1].toUpperCase());
        }
      }

      return [...ids];
    }

    async function readTextPages(pdfjs, file, views, split, label) {
      const task = pdfjs.getDocument({
        data: new Uint8Array(await file.arrayBuffer()),
        isEvalSupported: false
      });

      try {
        const document = await task.promise;
        const result = [];

        for (const [index, view] of views.entries()) {
          const page = await document.getPage(index + 1);
          const { box, rotation } = view;
          const viewport = page.getViewport({ scale: 1, rotation });
          const [leftX, bottomY] = viewport.convertToViewportPoint(box.left, box.bottom);
          const [rightX, topY] = viewport.convertToViewportPoint(box.right, box.top);
          const offsetX = Math.min(leftX, rightX);
          const offsetY = Math.min(bottomY, topY);
          const sections = split ? quadrants.map(() => []) : [[]];
          const { items } = await page.getTextContent();

          for (const item of items) {
            if (!item.str?.trim()) continue;

            const [a, b, , , tx, ty] = item.transform;
            const angle = Math.atan2(b, a);
            const [x, y] = viewport.convertToViewportPoint(tx, ty);
            const [endX, endY] = viewport.convertToViewportPoint(
              tx + item.width * Math.cos(angle),
              ty + item.width * Math.sin(angle)
            );

            const centerX = (x + endX) / 2 - offsetX;
            const centerY = (y + endY) / 2 - offsetY - item.height / 2;

            if (centerX < 0 || centerX >= view.width ||
                centerY < 0 || centerY >= view.height) continue;

            const section = split
                            ? 2 * Number(centerX >= view.width / 2) +
                              Number(centerY >= view.height / 2)
                            : 0;

            sections[section].push({ text: item.str, x, y, endX, height: item.height });
          }

          result.push(sections.map(orderIds));
        }

        return result;
      }
      catch (error) {
        throw new Error('Could not extract text from the ' + label + ' PDF. ' + error.message);
      }
      finally {
        await task.destroy();
      }
    }

    function matchSections(awbText, packingText) {
      const byId = new Map();
      let sectionsWithIds = 0;

      for (const [sheet, sections] of packingText.entries()) {
        for (const [part, ids] of sections.entries()) {
          const location = 'Packing list page ' + (sheet + 1) + ', ' + quadrants[part].label;

          if (ids.length > 1) {
            throw new Error(location + ' has multiple Order IDs: ' + ids.join(', ') + '.');
          }
          if (!ids.length) continue;

          const [id] = ids;
          const matches = byId.get(id) ?? [];
          matches.push({ sheet, part });
          byId.set(id, matches);
          sectionsWithIds++;
        }
      }

      const errors = [];
      const seen = new Set();

      const matchesByAwb = awbText.map(([ids], index) => {
        const location = 'AWB page ' + (index + 1);

        if (ids.length !== 1) {
          errors.push(ids.length
            ? location + ' has multiple Order IDs: ' + ids.join(', ') + '.'
            : location + ' has no readable Order ID.');
          return;
        }

        const [id] = ids;
        if (seen.has(id)) errors.push(location + ' repeats Order ID ' + id + '.');
        seen.add(id);

        const matches = byId.get(id) ?? [];
        if (!matches.length) {
          errors.push(location + ': no packing list section found for ' + id + '.');
        }

        return matches;
      });

      if (errors.length) throw new Error(errors.join('\n'));
      return { matchesByAwb, sectionsWithIds };
    }

    async function combine(awbFile, packingFile) {
      if (!window.PDFLib) {
        throw new Error('The PDF library could not load. Reload the page and try again.');
      }

      const awb = await readPdf(awbFile, 'airway bill');
      const packing = await readPdf(packingFile, 'packing list');
      const awbViews = validate(awb, 'Airway bill', 99.8, 149.9);
      const packingViews = validate(packing, 'Packing list', 210, 297);

      const pdfjs = await loadTextReader();
      const awbText = await readTextPages(pdfjs, awbFile, awbViews, false, 'airway bill');
      const packingText = await readTextPages(pdfjs, packingFile, packingViews, true, 'packing list');
      const { matchesByAwb, sectionsWithIds } = matchSections(awbText, packingText);

      const result = await PDFLib.PDFDocument.create();
      const awbPages = await result.copyPages(awb, awb.getPageIndices());
      const embeddedSheets = new Map();

      let matchedSections = 0;
      for (const [index, matches] of matchesByAwb.entries()) {
        result.addPage(awbPages[index]);

        for (const { sheet, part } of matches) {
          const { box, rotation, width, height } = packingViews[sheet];
          const halfWidth = width / 2;
          const halfHeight = height / 2;

          if (!embeddedSheets.has(sheet)) {
            const sourcePage = packing.getPage(sheet);
            // pdf-lib needs a content stream even when the source page is blank.
            if (!sourcePage.node.Contents()) {
              sourcePage.pushOperators(PDFLib.pushGraphicsState(), PDFLib.popGraphicsState());
            }
            embeddedSheets.set(sheet, await result.embedPage(sourcePage, box));
          }

          const origins = {
            0: [0, 0],
            90: [0, height],
            180: [width, height],
            270: [width, 0]
          };
          const [originX, originY] = origins[rotation];
          const { column, row } = quadrants[part];

          const page = result.addPage([halfWidth, halfHeight]);
          page.drawPage(embeddedSheets.get(sheet), {
            x: originX - column * halfWidth,
            y: originY - (1 - row) * halfHeight,
            rotate: PDFLib.degrees(-rotation)
          });
          matchedSections++;
        }
      }

      return {
        bytes: await result.save(),
        pageCount: result.getPageCount(),
        matchedSections,
        sectionsWithIds
      };
    }

    const form = document.getElementById('combiner');
    const awbInput = document.getElementById('awb');
    const packingInput = document.getElementById('packing');
    const button = form.querySelector('button');
    const status = document.getElementById('status');
    const download = document.getElementById('download');
    let downloadUrl;

    function clearDownload() {
      if (downloadUrl) URL.revokeObjectURL(downloadUrl);
      downloadUrl = undefined;
      download.removeAttribute('href');
      download.hidden = true;
    }

    download.addEventListener('click', () => {
      awbInput.value = '';
      packingInput.value = '';
    });

    form.addEventListener('input', () => {
      clearDownload();
      status.removeAttribute('data-error');
      status.textContent = '';
    });

    form.addEventListener('submit', async event => {
      event.preventDefault();
      const awbFile = awbInput.files[0];
      const packingFile = packingInput.files[0];
      clearDownload();

      button.disabled = true;
      awbInput.disabled = true;
      packingInput.disabled = true;
      status.removeAttribute('data-error');
      status.textContent = 'Reading Order IDs and combining PDFs…';

      try {
        const { bytes, pageCount, matchedSections, sectionsWithIds } =
          await combine(awbFile, packingFile);
        downloadUrl = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
        download.href = downloadUrl;
        download.hidden = false;
        status.textContent = pageCount + ' pages ready. Matched ' + matchedSections + ' of ' +
          sectionsWithIds + ' packing list sections with readable Order IDs.';
      }
      catch (error) {
        status.setAttribute('data-error', '');
        status.textContent = error.message;
      }
      finally {
        awbInput.disabled = false;
        packingInput.disabled = false;
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
